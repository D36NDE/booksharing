{% extends "layout.html" %}

{% block content %}
<div class="glass" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
    <h2>Tauschanfrage stellen</h2>
    
    <div style="background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; border-left: 4px solid var(--primary);">
        <p>Du möchtest:</p>
        <h3 style="margin-top: 0.5rem; margin-bottom: 0;">{{ target_book.title }}</h3>
        <p style="font-size: 0.875rem;">von {{ target_book.author }}</p>
    </div>

    <form method="POST" action="{{ url_for('request_book', book_id=target_book.id) }}">
        <div class="form-group">
            <label for="offered_book_id">Welches Buch möchtest du im Gegenzug anbieten?</label>
            <select id="offered_book_id" name="offered_book_id" required>
                <option value="" disabled selected>-- Bitte wähle ein Buch --</option>
                {% for book in my_books %}
                <option value="{{ book.id }}">{{ book.title }} ({{ book.condition }})</option>
                {% endfor %}
            </select>
            {% if not my_books %}
            <p style="color: var(--error); margin-top: 0.5rem; font-size: 0.875rem;">Du musst zuerst ein eigenes Buch hinzufügen, bevor du tauschen kannst!</p>
            {% endif %}
        </div>
        
        <div class="button-group">
            <a href="{{ url_for('index') }}" class="btn btn-secondary" style="flex: 1;">Abbrechen</a>
            <button type="submit" class="btn btn-primary" style="flex: 1;" {% if not my_books %}disabled{% endif %}>Anfrage senden</button>
        </div>
    </form>
</div>
{% endblock %}
