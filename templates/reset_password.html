{% extends "layout.html" %}

{% block title %}Neues Passwort vergeben - BookSharing{% endblock %}

{% block meta %}
<meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block content %}
<div class="glass" style="max-width: 400px; margin: 4rem auto; padding: 2rem;">
    <h2
        style="text-align: center; margin-bottom: 2rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        Neues Passwort vergeben</h2>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="password">Neues Passwort</label>
            <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
        </div>

        <div class="form-group">
            <label for="password_confirm">Neues Passwort bestätigen</label>
            <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password" minlength="8">
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Passwort speichern</button>
        </div>
    </form>
</div>
{% endblock %}
