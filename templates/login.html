{% extends "layout.html" %}

{% block content %}
<div class="glass" style="max-width: 400px; margin: 4rem auto; padding: 2rem;">
    <h2
        style="text-align: center; margin-bottom: 2rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        Login bei BookSharing</h2>

    <form method="POST" action="{{ url_for('login') }}">
        {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
        {% endif %}
        <div class="form-group">
            <label for="username">Benutzername</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Einloggen</button>
        </div>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9em; color: var(--text-muted);">
        Noch kein Konto? <a href="{{ url_for('register') }}" style="color: var(--primary); text-decoration: none; font-weight: 500; transition: color 0.2s;">Jetzt registrieren</a>
    </p>
</div>
{% endblock %}
