{% extends "layout.html" %}

{% block content %}
<div class="glass" style="max-width: 400px; margin: 4rem auto; padding: 2rem;">
    <h2
        style="text-align: center; margin-bottom: 2rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        Willkommen bei BookSharing</h2>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Benutzername</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="email">E-Mail Adresse <span style="font-size: 0.8em; color: var(--text-muted);">(Nur für
                    Registrierung)</span></label>
            <input type="email" id="email" name="email" autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <div class="button-group">
            <button type="submit" name="action" value="login" class="btn btn-primary" style="flex: 1;">Login</button>
            <button type="submit" name="action" value="register" class="btn btn-secondary"
                style="flex: 1;">Registrieren</button>
        </div>
    </form>
</div>
{% endblock %}
